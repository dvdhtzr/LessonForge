name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    name: .NET build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Build the .NET projects explicitly rather than the whole solution: the
      # solution also contains web/web.esproj (the front end), which needs Node and
      # is covered by the separate "frontend" job below. The Api and Tests projects
      # transitively reference Core.
      - name: Restore
        run: |
          dotnet restore LessonForge.Api/LessonForge.Api.csproj
          dotnet restore LessonForge.Tests/LessonForge.Tests.csproj

      - name: Build
        run: |
          dotnet build LessonForge.Api/LessonForge.Api.csproj --configuration Release --no-restore
          dotnet build LessonForge.Tests/LessonForge.Tests.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test LessonForge.Tests/LessonForge.Tests.csproj --configuration Release --no-build --verbosity normal

  frontend:
    name: Web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check & build
        run: npm run build
