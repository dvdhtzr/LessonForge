name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    name: .NET build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # The test project references Core and Api, so building it compiles the
      # whole C# solution. The web/web.esproj in the .slnx needs the JavaScript
      # SDK and is handled by the separate web job below.
      - name: Restore
        run: dotnet restore LessonForge.Tests/LessonForge.Tests.csproj

      - name: Build (Release)
        run: dotnet build LessonForge.Tests/LessonForge.Tests.csproj -c Release --no-restore

      - name: Test
        run: dotnet test LessonForge.Tests/LessonForge.Tests.csproj -c Release --no-build --verbosity normal

  web:
    name: Web lint, type-check & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install (npm ci)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check & build
        run: npm run build
